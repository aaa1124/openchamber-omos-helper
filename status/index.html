<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent presets</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--oc-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    font-size: 0.857rem;
    line-height: 1.45;
    color: var(--oc-fg, inherit);
    background: transparent;
    overscroll-behavior: contain;
  }
  #root { padding: 8px 10px 10px; min-width: 0; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .head { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .preset {
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    flex: none;
    font-size: 0.714rem;
    line-height: 1.4;
    padding: 0 5px;
    border-radius: 999px;
    border: 1px solid var(--oc-border, rgba(128,128,128,0.3));
    color: var(--oc-muted, #888);
  }
  .count {
    margin-left: auto;
    flex: none;
    font-size: 0.714rem;
    color: var(--oc-muted, #888);
    white-space: nowrap;
  }
  .agents { margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
  .agent-wrap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .agent {
    display: grid;
    grid-template-columns: 7px minmax(0, auto) minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .agent .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--oc-muted, #888);
    transition: background-color 140ms ease, box-shadow 140ms ease;
  }
  .agent[data-status="match"] .dot { background: var(--oc-success, #3c3); }
  .agent[data-status="drift"] .dot { background: var(--oc-warning, #d90); }
  .agent[data-status="missing"] .dot {
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--oc-warning, #d90);
  }
  .agent[data-live] .dot {
    box-shadow: 0 0 0 2px var(--oc-subtle, rgba(128,128,128,0.16));
    animation: omos-live-pulse 1.7s ease-in-out infinite;
  }
  .agent[data-live="running"] .dot { background: var(--oc-primary, #6af); }
  .agent[data-live="retrying"] .dot,
  .agent[data-live="waiting"] .dot { background: var(--oc-warning, #d90); }
  .agent .name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agent .model {
    font-family: var(--oc-mono, ui-monospace, Consolas, monospace);
    font-size: 0.786rem;
    color: var(--oc-muted, #888);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agent .model.inherited { font-style: italic; }
  .agent .variant {
    font-size: 0.714rem;
    padding: 0 4px;
    border-radius: 4px;
    background: var(--oc-subtle, rgba(128,128,128,0.14));
    color: var(--oc-muted, #888);
  }
  .runs {
    list-style: none;
    margin: 1px 0 3px 13px;
    padding: 1px 0 1px 6px;
    border-left: 1px solid var(--oc-border, rgba(128,128,128,0.24));
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .run-item { display: block; min-width: 0; }
  .runs .run {
    display: flex;
    align-items: center;
    gap: 4px;
    width: 100%;
    min-width: 0;
    padding: 1px 4px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font-size: 0.786rem;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
  }
  .runs .run:hover:not(:disabled) {
    background: var(--oc-subtle, rgba(128,128,128,0.14));
    border-color: transparent;
  }
  .runs .run:active:not(:disabled) { background: var(--oc-subtle, rgba(128,128,128,0.2)); }
  .runs .run:focus-visible { outline: 2px solid var(--oc-primary, #6af); outline-offset: -2px; }
  .run .glyph {
    flex: none;
    display: inline-block;
    width: 10px;
    text-align: center;
    font-size: 0.714rem;
    line-height: 1;
    color: var(--oc-muted, #888);
  }
  .run .run-owner {
    flex: none;
    max-width: 32%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.714rem;
    color: var(--oc-muted, #888);
  }
  .run .run-owner::after { content: "·"; margin-left: 4px; opacity: 0.65; }
  .run .run-label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .run .run-status {
    flex: none;
    font-size: 0.714rem;
    color: var(--oc-muted, #888);
    white-space: nowrap;
  }
  .run .run-open {
    flex: none;
    color: var(--oc-muted, #888);
    opacity: 0.65;
    font-size: 0.857rem;
    line-height: 1;
  }
  .run[data-status="running"] .glyph { color: var(--oc-primary, #6af); }
  .run[data-status="retrying"] .glyph {
    color: var(--oc-warning, #d90);
    animation: omos-turn 2s linear infinite;
  }
  .run[data-status="waiting-permission"] .glyph,
  .run[data-status="waiting-question"] .glyph { color: var(--oc-warning, #d90); }
  .run[data-status="done"] .glyph { color: var(--oc-success, #3c3); }
  .run[data-status="failed"] .glyph { color: var(--oc-error, #f66); }
  .run[data-status="failed"] .run-status { color: var(--oc-error-text, var(--oc-error, #f66)); }
  .run[data-status="waiting-permission"] .run-status,
  .run[data-status="waiting-question"] .run-status {
    color: var(--oc-warning-text, var(--oc-warning, #d90));
  }
  .run[data-status="done"] .run-label { color: var(--oc-muted, #888); }
  .other { margin-top: 1px; }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 5px;
    margin: 7px 0 2px;
    font-size: 0.714rem;
    font-weight: 600;
    color: var(--oc-muted, #888);
  }
  .group-head .group-count { font-weight: 400; opacity: 0.8; }
  .other-runs { margin: 0; padding-left: 0; border-left: 0; }
  .note { margin-top: 5px; font-size: 0.714rem; color: var(--oc-muted, #888); }
  .note.warning { color: var(--oc-warning, #d90); }
  .note.error { color: var(--oc-error, #f66); }
  .footer { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  button {
    font: inherit;
    font-size: 0.714rem;
    color: var(--oc-fg, inherit);
    background: var(--oc-subtle, rgba(128,128,128,0.14));
    border: 1px solid var(--oc-border, rgba(128,128,128,0.3));
    border-radius: 5px;
    padding: 2px 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--oc-primary, #6af); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--oc-primary, #6af); outline-offset: 1px; }
  @keyframes omos-live-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  @keyframes omos-turn {
    to { transform: rotate(360deg); }
  }
  @media (pointer: coarse) {
    .footer button { min-height: 44px; padding: 4px 12px; }
    .runs .run { min-height: 32px; padding: 4px 6px; }
  }
  @media (max-width: 420px) {
    .runs { margin-left: 10px; padding-left: 4px; }
    .run .run-owner { max-width: 38%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .agent .dot { transition: none; }
    .agent[data-live] .dot,
    .run[data-status="retrying"] .glyph { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="main.js"></script>
</body>
</html>
